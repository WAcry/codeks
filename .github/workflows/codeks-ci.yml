# codeks fork CI. Design: fork/patches/0003-codeks-ci.md
name: codeks-ci

on:
  workflow_dispatch:
    inputs:
      crates:
        description: Crates to test, separated by spaces. Empty means the crates that the fork patches touch.
        required: false
        default: ""

concurrency:
  group: codeks-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Patch stack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      crates: ${{ steps.scope.outputs.crates }}
      filter: ${{ steps.scope.outputs.filter }}
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Enough history to reach the upstream base below the patch stack.
          fetch-depth: 100
          persist-credentials: false
      - name: Check patch stack and documents
        run: python3 fork/tools/codeks.py check
      - name: Select Rust scope
        id: scope
        env:
          CRATES: ${{ inputs.crates }}
        run: python3 fork/tools/codeks.py scope --crates "$CRATES" | tee -a "$GITHUB_OUTPUT"
      # codeks 0003: isolate heavy crates to avoid runner loss during full-scope test builds.
      - name: Split Rust scope into independent runners
        id: split
        env:
          CRATES: ${{ steps.scope.outputs.crates }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          crates = os.environ["CRATES"].split()
          groups = []
          for crate in ("codex-core", "codex-app-server", "codex-tui"):
              if crate in crates:
                  crates.remove(crate)
                  groups.append({"name": crate, "crates": crate})
          for i in range(0, len(crates), 4):
              group = crates[i:i + 4]
              groups.append({"name": f"group-{i // 4 + 1}", "crates": " ".join(group)})
          print("matrix=" + json.dumps(groups or [{"name": "none", "crates": ""}]))
          PY

  rust:
    name: Rust (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.rust == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: codex-rs
    env:
      CRATES: ${{ matrix.crates }}
      FILTER: ${{ needs.check.outputs.filter }}
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUST_MIN_STACK: "8388608"
      SCCACHE_CACHE_SIZE: 6G
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache@0.7.5,nextest@0.9.103
      - name: Restore build cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ runner.temp }}/sccache
          key: codeks-rust-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}-${{ matrix.name }}
          restore-keys: |
            codeks-rust-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-
            codeks-rust-
      - name: Enable sccache
        run: |
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=$(command -v sccache)" >> "$GITHUB_ENV"
      - name: Use the upstream development version
        # Upstream tests expect version 0.0.0, as on upstream main. A release tag changes only this line.
        run: |
          sed -i -E '/^\[workspace\.package\]$/,/^\[/ s/^version = "[^"]*"$/version = "0.0.0"/' Cargo.toml
          grep -A1 -x '\[workspace\.package\]' Cargo.toml | grep -qx 'version = "0.0.0"'
      - name: Format
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Build CLI and test helpers
        run: cargo build --bin codex --bin codex-code-mode-host --bin codex-exec-server --bin codex-linux-sandbox --bin codex-message-board-mcp --bin test_stdio_server --bin test_streamable_http_server
      - name: Test touched crates
        if: env.CRATES != ''
        run: |
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          # Upstream tests that the patches change on purpose (ci_skip in the patch documents).
          if [ -n "$FILTER" ]; then args+=(-E "$FILTER"); fi
          # Temporary review: execute all scenario and catalog-plugin snapshots without changing main.
          cargo nextest run --no-fail-fast --test-threads 2 -p codex-core -E 'test(suite::scenarios) | test(suite::request_plugin_install::catalog_plugin_recommendations)'
      # codeks 0003: keep complete failed Insta candidates for reviewing snapshot drift.
      - name: Upload failed snapshot candidates
        if: failure() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codeks-snapshots-${{ matrix.name }}
          path: codex-rs/**/*.snap.new
          if-no-files-found: ignore
          retention-days: 7
      - name: Save build cache
        if: always() && !cancelled()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ runner.temp }}/sccache
          key: codeks-rust-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}-${{ github.run_id }}-${{ matrix.name }}
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
