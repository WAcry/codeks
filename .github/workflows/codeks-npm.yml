name: codeks-npm

# Builds the codeks npm packages (linux-x64) and, on request, publishes them.
# Start it with: python3 fork/tools/codeks.py npm [<codeks tag> | <branch>] [--publish]
# The build steps follow the x86_64-unknown-linux-musl job in rust-release.yml.
# See fork/patches/0004-codeks-npm.md (Chinese).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after the build (needs a codeks/* tag and npm credentials)
        type: boolean
        default: false

concurrency:
  group: codeks-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    name: Build linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CARGO_INCREMENTAL: "0"
      # Use the git CLI instead of Cargo's libgit2 path for git dependencies, as upstream does.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Check patch stack and resolve the npm version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          python3 fork/tools/codeks.py check
          args=()
          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--require-tag)
          fi
          python3 fork/tools/npm_package.py version "${args[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Install Linux bwrap build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Use hermetic Cargo home (musl)
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        run: bash .github/scripts/install-musl-build-tools.sh

      - name: Disable aws-lc jitter entropy (musl)
        run: |
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl

      - name: Build bwrap and export digest
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --release --bin bwrap
          bwrap_path="target/${TARGET}/release/bwrap"
          # Codex embeds this digest and checks the bundled bwrap before use.
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "bwrap sha256:${digest}"

      - name: Build codex
        working-directory: codex-rs
        run: |
          set -euo pipefail
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          export STABLE_GIT_COMMIT
          cargo build --target "$TARGET" --release --bin codex --bin codex-code-mode-host
          strip --strip-debug --strip-unneeded "target/${TARGET}/release/codex" "target/${TARGET}/release/codex-code-mode-host"

      - name: Download the zsh manifest that upstream releases use
        run: |
          set -euo pipefail
          zsh_tag="$(sed -n 's/^  CODEX_ZSH_RELEASE_TAG: *//p' .github/workflows/rust-release.yml)"
          zsh_sha256="$(sed -n 's/^  CODEX_ZSH_MANIFEST_SHA256: *//p' .github/workflows/rust-release.yml)"
          if [[ -z "$zsh_tag" || -z "$zsh_sha256" ]]; then
            echo "::error::rust-release.yml no longer pins the zsh manifest. See fork/patches/0004-codeks-npm.md."
            exit 1
          fi
          curl -fsSL "https://github.com/openai/codex/releases/download/${zsh_tag}/codex-zsh" -o "${RUNNER_TEMP}/codex-zsh"
          bash .github/scripts/verify-zsh-manifest.sh "${RUNNER_TEMP}/codex-zsh" "$zsh_sha256"

      - name: Assemble the codex package
        run: |
          set -euo pipefail
          release_dir="codex-rs/target/${TARGET}/release"
          python3 scripts/build_codex_package.py \
            --target "$TARGET" \
            --variant codex \
            --cargo-profile release \
            --entrypoint-bin "${release_dir}/codex" \
            --code-mode-host-bin "${release_dir}/codex-code-mode-host" \
            --bwrap-bin "${release_dir}/bwrap" \
            --zsh-manifest "${RUNNER_TEMP}/codex-zsh" \
            --package-dir "${RUNNER_TEMP}/vendor/${TARGET}" \
            --force

      - name: Pack and smoke test the npm packages
        run: |
          set -euo pipefail
          python3 fork/tools/npm_package.py pack --vendor-src "${RUNNER_TEMP}/vendor" --output-dir "${RUNNER_TEMP}/npm"
          python3 fork/tools/npm_package.py smoke --dir "${RUNNER_TEMP}/npm"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codeks-npm-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing (OIDC), used when the NPM_TOKEN secret is not set.
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeks-npm-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/npm

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Node 24 bundles npm >= 11.5.1, which trusted publishing requires.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 fork/tools/npm_package.py publish --dir "${RUNNER_TEMP}/npm"
